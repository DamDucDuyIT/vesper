<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background macOS Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1e24" />
      <stop offset="50%" stop-color="#121317" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Prism Refraction Core -->
    <linearGradient id="prismLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#4facfe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6b11ff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Amber Purge Pulse -->
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <!-- Soft Drop Shadow for Glass Surfaces -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base macOS App Icon Canvas (Apple continuous corner squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle Concentric Storage Track Rings -->
  <g opacity="0.22" stroke="#4facfe" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="170" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="130" stroke-dasharray="8 6" />
    <circle cx="256" cy="256" r="90" />
  </g>

  <!-- Sonar / Radar Sector Arc (Inspecting Hidden Depths) -->
  <path d="M 256 256 L 376 136 A 170 170 0 0 0 170 109 Z" fill="url(#scanBeam)" opacity="0.35" />

  <!-- Hidden Sub-Sector Dots (Finding Tiny Hidden Clusters) -->
  <circle cx="160" cy="180" r="4.5" fill="#bf5af2" opacity="0.85" filter="url(#glow)"/>
  <circle cx="340" cy="190" r="5" fill="#00f2fe" opacity="0.9" filter="url(#glow)"/>
  <circle cx="195" cy="340" r="4" fill="#30d158" opacity="0.85" />
  <circle cx="330" cy="320" r="6" fill="#ff9900" opacity="0.9" filter="url(#glow)"/>

  <!-- Center Geometry: The "Vesper / Obsidian Prism" (Facet of Depth & Precision) -->
  <!-- Facet Left (Deep Obsidian) -->
  <polygon points="256,120 160,256 256,392" fill="#1b2434" opacity="0.9" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Facet Right (Light Refraction) -->
  <polygon points="256,120 352,256 256,392" fill="url(#prismLight)" opacity="0.92" filter="url(#glow)"/>
  <!-- Facet Inner Horizon Split -->
  <polygon points="256,180 320,256 256,332" fill="#ffffff" opacity="0.25"/>
  
  <!-- The Purge/Sweep Beam Ring intersecting the Prism -->
  <path d="M 130 256 A 126 126 0 0 1 382 256" fill="none" stroke="url(#amberGlow)" stroke-width="5" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

  <!-- Center Crystal Core -->
  <circle cx="256" cy="256" r="9" fill="#ffffff" filter="url(#glow)" />

  <!-- Inner Bevel Rim Light for macOS Native Depth -->
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
</svg>

